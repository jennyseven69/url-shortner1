<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f4f4f4 0%, #e9f7ff 100%);
            padding: 30px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            color: #222;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th {
            background: #74ebd5;
            color: #333;
            font-weight: 600;
        }
        th, td {
            padding: 10px 12px;
            text-align: center;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        a {
            color: #0077cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .button {
            display: inline-block;
            padding: 6px 12px;
            background: #4fc3f7;
            color: white !important;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .button:hover {
            background: #039be5;
        }
        td:first-child {
            text-align: left;
            max-width: 400px;
            word-break: break-all;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0077cc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .no-data {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Dashboard</h2>

        {% if data %}
        <table>
            <tr>
                <th>Original URL</th>
                <th>Short URL</th>
                <th>Clicks</th>
                <th>Logs</th>
            </tr>
            {% for row in data %}
            <tr>
                <!-- row[0] = original_url -->
                <td>{{ row[0] }}</td>
                <!-- row[1] = short_key -->
                <td><a href="/{{ row[1] }}" target="_blank">/{{ row[1] }}</a></td>
                <!-- row[2] = clicks -->
                <td>{{ row[2] }}</td>
                <!-- Link to logs -->
                <td><a class="button" href="/logs/{{ row[1] }}">View Logs</a></td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
            <p class="no-data">No URLs created yet.</p>
        {% endif %}

        <a href="/" class="back-link">⬅ Back</a>
    </div>
</body>
</html>
