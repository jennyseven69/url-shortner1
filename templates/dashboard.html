<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>📊 Dashboard</h2>
        <table>
            <tr>
                <th>Original URL</th>
                <th>Short URL</th>
                <th>Clicks</th>
                <th>Shares</th>
                <th>Logs</th>
            </tr>
            {% for row in data %}
            <tr>
                <td style="text-align:left; max-width:400px; word-break:break-all;">{{ row[0] }}</td>
                <td><a href="/{{ row[1] }}" target="_blank">/{{ row[1] }}</a></td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
                <td><a class="button" href="/logs/{{ row[1] }}">View Logs</a></td>
            </tr>
            {% endfor %}
        </table>
        <a href="/">⬅ Back</a>
    </div>
</body>
</html>
